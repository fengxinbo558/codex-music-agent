[project]
name = "music-workroom-local-audio"
version = "0.1.0"
description = "Isolated local stem separation and deterministic vocal editing service"
requires-python = ">=3.11,<3.14"
dependencies = [
  "demucs>=4.0.1",
  "fastapi>=0.115",
  "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "numpy>=2.0",
  "python-multipart>=0.0.20",
  "scipy>=1.14",
  "soundfile>=0.13",
  "torch>=2.5",
  "torchaudio>=2.5",
  "uvicorn>=0.34",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audio_service"]
